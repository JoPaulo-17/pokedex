<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
</head>
<body>
    <main>
        <img id="pkimg" class="pokemon_img" src="a" alt="pokemon">
        <h1>
            <form id="form" class="form">
                <input type="search"
                id="input"
                class="input_search"
                placeholder="Nome ou Número"
                required>
            </form>

            <div class="buttons">
                <button id="bnt-prev" class="button"> Prev &lt;</button>
                <button id="bnt-next" class="button"> Next &gt;</button>
            </div>

            <img class="pokedex" src="pokedex.png" alt="Pokédex">
        </h1>
    </main>
</body>
</html>
